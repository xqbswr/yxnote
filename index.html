<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>热门小说榜</title>
    <meta name="description" content="从多个书源站自动汇总的热门小说榜单，每天更新。" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap">
        <div class="top-main">
          <h1>热门小说榜</h1>
          <p class="sub" id="meta">正在加载…</p>
        </div>
        <a class="app-link" href="./rank.json" id="rawLink" title="原始数据">JSON</a>
      </div>
    </header>

    <div class="wrap controls">
      <div class="search">
        <input id="q" type="search" placeholder="搜书名 / 作者 / 分类" autocomplete="off" />
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <main class="wrap">
      <ol class="list" id="list"></ol>
      <p class="empty" id="empty" hidden>没有匹配的书</p>
    </main>

    <footer class="foot wrap">
      <p>
        榜单由脚本从各书源站的公开排行榜页抓取，每天自动更新一次。
        「几站」表示这本书同时出现在几个站点，是比单站排名更可靠的参考。
      </p>
      <p class="dim">
        数据指向第三方站点，内容与可用性由该站点负责。本站只做汇总索引，不存储任何书籍内容。
      </p>
    </footer>

    <script src="./app.js"></script>
  </body>
</html>
